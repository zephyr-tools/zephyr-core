appId: ai.sourcehunter.zephyr
productName: Zephyr
directories:
  output: release/${version}
  buildResources: build
files:
  - out/**/*
  - package.json
asar: true
mac:
  category: public.app-category.utilities
  target:
    - target: dmg
      arch: [arm64, x64]
win:
  target:
    - target: nsis
      arch: [x64]
linux:
  target:
    - AppImage
  category: Utility
