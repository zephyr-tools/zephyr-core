appId: ai.sourcehunter.zephyr
productName: Zephyr
directories:
  output: release/${version}
  buildResources: build
files:
  - out/**/*
  - package.json
asar: true
publish:
  provider: github
  owner: zephyr-tools
  repo: zephyr-core
mac:
  category: public.app-category.utilities
  target:
    - target: dmg
      arch: [arm64, x64]
win:
  target:
    - target: nsis
      arch: [x64]
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
  artifactName: ${productName}-Setup-${version}-${os}-${arch}.${ext}
linux:
  target:
    - AppImage
  category: Utility
