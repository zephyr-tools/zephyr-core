name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Force LF line endings
        run: git config --global core.autocrlf false

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build and publish
        run: npm run build && npx electron-builder --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute version (strip leading v)
        id: version
        shell: bash
        run: echo "v=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          append_body: true
          body: |
            ## Download

            👉 **[Zephyr-Setup-${{ steps.version.outputs.v }}-win-x64.exe](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/Zephyr-Setup-${{ steps.version.outputs.v }}-win-x64.exe)** — Windows installer. This is the file to run.

            <sub>`latest.yml` and `.blockmap` are metadata used by the in-app auto-updater — you don't need to download them.</sub>

            ---
          draft: false
          files: |
            release/**/*.exe
            release/**/*.blockmap
            release/**/latest.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
